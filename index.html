<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birahim Diagne - Portfolio</title>
    <style>
        /* Supprime toutes les marges et cache le scroll du navigateur */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #333; /* Couleur de fond pro */
        }
        /* Le PDF prend toute la place disponible */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <iframe src="document.pdf#view=FitH&toolbar=0&navpanes=0"></iframe>
</body>
</html>
